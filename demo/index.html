<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>skipverse — living HNSW search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #07090f;
    --panel: #0d1117;
    --panel2: #111827;
    --border: #1f2937;
    --text: #e5e7eb;
    --dim: #8b93a5;
    --accent: #38bdf8;
    --good: #34d399;
    --hit: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; }
  header h1 .star { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 11px; }
  .badge {
    margin-left: auto; font-size: 10px; letter-spacing: 1px; padding: 3px 9px;
    border: 1px solid var(--border); border-radius: 99px; color: var(--dim);
  }
  .badge.server { color: var(--good); border-color: rgba(52, 211, 153, 0.4); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  aside {
    width: 330px; border-left: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; padding: 14px 16px 24px; flex-shrink: 0;
  }
  section { margin-bottom: 18px; }
  section h2 {
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
  }
  label.row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0 2px; }
  label.row .v { color: var(--accent); }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  button {
    width: 100%; padding: 8px 10px; margin-top: 8px; cursor: pointer;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; font: inherit; letter-spacing: 0.3px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.5); color: var(--accent); }
  .layers { display: flex; flex-direction: column; gap: 4px; }
  .layers label { display: flex; gap: 8px; align-items: center; cursor: pointer; padding: 2px 0; }
  .layers input { accent-color: var(--accent); }
  .layers .count { color: var(--dim); margin-left: auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .stats div { display: flex; justify-content: space-between; }
  .stats span { color: var(--dim); }
  .stats b { font-weight: 600; color: var(--text); }
  .results { display: flex; flex-direction: column; gap: 2px; }
  .results .r { display: flex; gap: 8px; }
  .results .r .rk { color: var(--dim); width: 18px; }
  .results .r .rd { margin-left: auto; color: var(--dim); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span class="star">✦</span> skipverse</h1>
  <span class="sub">a from-scratch vector database — watch the HNSW graph do its greedy dive</span>
  <span class="badge" id="engine-badge">…</span>
</header>
<main>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside>
    <section>
      <h2>Index</h2>
      <label class="row"><span>M (degree)</span><span class="v" id="v-m">16</span></label>
      <input type="range" id="s-m" min="4" max="48" step="2" value="16" />
      <label class="row"><span>efConstruction</span><span class="v" id="v-efc">200</span></label>
      <input type="range" id="s-efc" min="50" max="500" step="25" value="200" />
      <button class="primary" id="b-rebuild">Rebuild index</button>
      <div class="stats" id="index-stats" style="margin-top:8px"></div>
    </section>
    <section>
      <h2>Search</h2>
      <label class="row"><span>k (results)</span><span class="v" id="v-k">8</span></label>
      <input type="range" id="s-k" min="1" max="20" step="1" value="8" />
      <label class="row"><span>efSearch</span><span class="v" id="v-ef">64</span></label>
      <input type="range" id="s-ef" min="8" max="256" step="8" value="64" />
      <label class="row"><span>hop duration</span><span class="v" id="v-speed">220ms</span></label>
      <input type="range" id="s-speed" min="40" max="500" step="20" value="220" />
      <button id="b-random">✦ Random query</button>
      <div class="hint">…or click anywhere on the canvas to query that point.</div>
    </section>
    <section>
      <h2>Layers</h2>
      <div class="layers" id="layer-list"></div>
    </section>
    <section>
      <h2>Trace</h2>
      <div class="stats" id="trace-stats"></div>
      <div class="results" id="results" style="margin-top:8px"></div>
    </section>
  </aside>
</main>
<script src="./bundle.js"></script>
</body>
</html>
